[package]
name = "backups-transfer"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "PQC identity, pairing, and remote replication"

[features]
default = []
pqc = ["dep:simple_network", "dep:simple-secrets", "dep:tokio", "dep:rpassword", "dep:hex", "dep:zeroize"]

[dependencies]
anyhow = { workspace = true }
backups-core = { workspace = true }
backups-store = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
hex = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
rpassword = { workspace = true, optional = true }
zeroize = { workspace = true, optional = true }
simple_network = { workspace = true, optional = true, features = ["pqc"] }
simple-secrets = { workspace = true, optional = true }

[dev-dependencies]
tempfile = { workspace = true }
backups-engine = { workspace = true }
tokio = { workspace = true }
